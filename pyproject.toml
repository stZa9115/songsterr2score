[project]
name = "songsterr2score"
version = "0.1.0"
description = "Songsterr 另存的 HTML -> 五線譜 / TAB (PDF, MusicXML)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.1",
    "python-multipart>=0.0.32",
    "svgpathtools",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
